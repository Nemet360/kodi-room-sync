name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The add-on and its tests use only the standard library on purpose: Kodi
      # ships no third-party packages, and the official add-on repository has no
      # crypto library at all (a scan of all 2,327 add-ons in Omega found only
      # script.module.pyscrypt). Anything that needed a dependency here would be
      # a dependency the televisions cannot have.
      - name: Install the manifest checker
        run: python -m pip install kodi-addon-checker

      - name: Test the add-on
        run: python -m unittest discover -s addon/plugin.video.roomwatchsync/tests -v

      - name: Test the AutoCompletion add-on
        run: python -m unittest discover -s addon/plugin.program.autocompletion/tests -v

      - name: Validate Kodi manifests and assets
        timeout-minutes: 10
        run: kodi-addon-checker --branch matrix --skip-dependency-checks --reporter console addon/plugin.video.roomwatchsync addon/repository.roomwatchsync addon/plugin.program.autocompletion

      - name: Test the repository builder and the site generator
        run: python -m unittest discover -s tools/tests -v

      # Fails if disclaimer.html has drifted from DISCLAIMER.md. A legal text
      # that says two different things in two places is worse than one.
      - name: Check the published disclaimer is current
        run: |
          python tools/build_disclaimer.py
          git diff --exit-code -- disclaimer.html

      - name: Build the Kodi repository
        run: python tools/build_repository.py

      # The repository directory is committed, because GitHub Pages serves it
      # straight from the branch. A build that changes it and is not committed
      # means the zip people install is not the code in this commit.
      - name: Check the built repository is committed
        run: git diff --exit-code -- repository/

      - name: Upload the Kodi repository
        uses: actions/upload-artifact@v4
        with:
          name: kodi-repository
          path: repository/
          if-no-files-found: error
