name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r server/requirements-dev.txt kodi-addon-checker
      - name: Test sync server
        env:
          PYTHONPATH: server
        run: python -m pytest -q server/tests
      - name: Test Kodi client modules
        run: python -m unittest discover -s addon/plugin.video.roomwatchsync/tests -v
      - name: Validate Kodi manifests and assets
        timeout-minutes: 10
        run: kodi-addon-checker --branch matrix --skip-dependency-checks --reporter console addon/plugin.video.roomwatchsync addon/repository.roomwatchsync
      - name: Test repository builder
        run: python -m unittest discover -s tools/tests -v
      - name: Build Kodi repository
        run: python tools/build_repository.py
      - name: Upload Kodi repository
        uses: actions/upload-artifact@v4
        with:
          name: kodi-repository
          path: repository/
          if-no-files-found: error
